services:
  postgres:
    image: postgres:16-alpine
    container_name: lifequest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifequest
      POSTGRES_PASSWORD: lifequest
      POSTGRES_DB: lifequest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
